name: Build and Deploy Container to AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-to-aws:
    name: Build Image and Deploy to Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository source code
        uses: actions/checkout@v4

      - name: Authenticate with AWS IAM
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets['AWS_ACCESS_KEY_ID'] }}
          aws-secret-access-key: ${{ secrets['AWS_SECRET_ACCESS_KEY'] }}
          aws-region: us-east-1

      - name: Authenticate Docker with Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Container Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: homebuyer-ai-engine
          IMAGE_TAG: latest
        run: |
          docker build --platform linux/amd64 -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name homebuyer-ai-engine \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/homebuyer-ai-engine:latest